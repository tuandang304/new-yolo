# PRA-a20 + a light third Detect level at stride 32 (L21-L26): pooled backbone L7 + context stage L11 up x2.
# PRA-a20: PRA-a with the P5 context stage (old L7-L10) run at stride 64 via an inserted 2x avg-pool (L7)
# and a x4 upsample back to stride 16; detection on P3/P4 as PRA-a. COCO tensors: old L0-6 -> L0-6, old L7-19 -> L8-20.
