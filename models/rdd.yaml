# RDD (working name): resolution-decoupled detector, input 1280.
# L0 = raw input; L1 = 2x average pool; L2-L21 = YOLO26n layers 0-19 (semantic trunk at 640, all COCO tensors
# inherited with index offset +2); P5 detection branch of YOLO26n dropped (P5 stage still feeds the top-down path).
# L22-L26 = thin depthwise-separable detail stream on the full 1280 input (stride 8, 64 ch);
# L27-L31 fuse the upsampled trunk P3 with the detail stream into F8. Detect on [F8 (s8), trunk P3 (s16), trunk P4 (s32)].
nc: 10
end2end: true
reg_max: 1
scale: n
scales:
  n: [0.5, 0.25, 1024]
backbone:
- - -1
  - 1
  - nn.Identity
  - []
- - -1
  - 1
  - nn.AvgPool2d
  - [2, 2]
- - -1
  - 1
  - Conv
  - [64, 3, 2]
- - -1
  - 1
  - Conv
  - [128, 3, 2]
- - -1
  - 2
  - C3k2
  - [256, false, 0.25]
- - -1
  - 1
  - Conv
  - [256, 3, 2]
- - -1
  - 2
  - C3k2
  - [512, false, 0.25]
- - -1
  - 1
  - Conv
  - [512, 3, 2]
- - -1
  - 2
  - C3k2
  - [512, true]
- - -1
  - 1
  - Conv
  - [1024, 3, 2]
- - -1
  - 2
  - C3k2
  - [1024, true]
- - -1
  - 1
  - SPPF
  - [1024, 5, 3, true]
- - -1
  - 2
  - C2PSA
  - [1024]
head:
- - -1
  - 1
  - nn.Upsample
  - [null, 2, nearest]
- - [-1, 8]
  - 1
  - Concat
  - [1]
- - -1
  - 2
  - C3k2
  - [512, true]
- - -1
  - 1
  - nn.Upsample
  - [null, 2, nearest]
- - [-1, 6]
  - 1
  - Concat
  - [1]
- - -1
  - 2
  - C3k2
  - [256, true]
- - -1
  - 1
  - Conv
  - [256, 3, 2]
- - [-1, 15]
  - 1
  - Concat
  - [1]
- - -1
  - 2
  - C3k2
  - [512, true]
- - 0
  - 1
  - Conv
  - [64, 3, 2]
- - -1
  - 1
  - DWConv
  - [64, 3, 2]
- - -1
  - 1
  - Conv
  - [128, 1, 1]
- - -1
  - 1
  - DWConv
  - [128, 3, 2]
- - -1
  - 1
  - Conv
  - [256, 1, 1]
- - 18
  - 1
  - nn.Upsample
  - [null, 2, nearest]
- - [-1, 26]
  - 1
  - Concat
  - [1]
- - -1
  - 1
  - Conv
  - [256, 1, 1]
- - -1
  - 1
  - DWConv
  - [256, 3, 1]
- - -1
  - 1
  - Conv
  - [256, 1, 1]
- - [31, 18, 21]
  - 1
  - Detect
  - [nc]
