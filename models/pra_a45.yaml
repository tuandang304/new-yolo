# R4e: wide stride-64 context stage (320 channels at width 0.25, cheap in FLOPs), full PAN, extra fresh stride-4 level; Detect P2/P3/P4.
# COCO: as A20 (old L0-6 -> L0-6, L7-19 -> L8-20); widened tensors take the overlapping channels; the P2 branch starts fresh.
nc: 10
end2end: true
reg_max: 1
scale: n
scales:
  n: [0.5, 0.25, 2048]
backbone:
- [-1, 1, Conv, [64, 3, 2]]
- [-1, 1, Conv, [128, 3, 2]]
- [-1, 2, C3k2, [256, false, 0.25]]
- [-1, 1, Conv, [256, 3, 2]]
- [-1, 2, C3k2, [512, false, 0.25]]
- [-1, 1, Conv, [512, 3, 2]]
- [-1, 2, C3k2, [512, true]]
- [-1, 1, nn.AvgPool2d, [2, 2]]
- [-1, 1, Conv, [1280, 3, 2]]
- [-1, 2, C3k2, [1280, true]]
- [-1, 1, SPPF, [1280, 5, 3, true]]
- [-1, 2, C2PSA, [1280]]
head:
- [-1, 1, nn.Upsample, [null, 4, nearest]]
- [[-1, 6], 1, Concat, [1]]
- [-1, 2, C3k2, [512, true]]
- [-1, 1, nn.Upsample, [null, 2, nearest]]
- [[-1, 4], 1, Concat, [1]]
- [-1, 2, C3k2, [256, true]]
- [-1, 1, Conv, [256, 3, 2]]
- [[-1, 14], 1, Concat, [1]]
- [-1, 2, C3k2, [512, true]]
- [17, 1, nn.Upsample, [null, 2, nearest]]
- [[-1, 2], 1, Concat, [1]]
- [-1, 1, C3k2, [96, false, 0.25]]
- [[23, 17, 20], 1, Detect, [nc]]
