# O-lite test-dev eval J4: ab2_s2, ab3_s0, ab3_s1, ab3_s2, ab4_s0. Eval only, no training. VisDrone test-dev, headline evaluator (multi-label NMS, max_det 1000, ignore-aware), saves detections for TIDE/density analysis.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  split: test
  latency: false
  latency_images: 200
  latency_passes: 2
  n_warm: 30
  n_iter: 200
  models:
  - {tag: ab2_s2, family: ultralytics, ckpt: weights/ab2_s2.pt, imgsz: 1280, save_dets: true}
  - {tag: ab3_s0, family: ultralytics, ckpt: weights/ab3_s0.pt, imgsz: 1280, save_dets: true}
  - {tag: ab3_s1, family: ultralytics, ckpt: weights/ab3_s1.pt, imgsz: 1280, save_dets: true}
  - {tag: ab3_s2, family: ultralytics, ckpt: weights/ab3_s2.pt, imgsz: 1280, save_dets: true}
  - {tag: ab4_s0, family: ultralytics, ckpt: weights/ab4_s0.pt, imgsz: 1280, save_dets: true}
