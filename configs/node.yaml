# G40 O1: Stack B unchanged, optimizer forced to MuSGD lr0 0.01 (what optimizer=auto picks at 100 ep). 30 epochs, seed 0, batch 8, one Kaggle T4.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: g40o1
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: true
    head_ctx:
      src: 11
      dim: 32
    win_attn:
      layer: 6
      dim: 32
      heads: 2
      win: 8
    head_b2c: true
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
