# Stack-line baseline: YOLO26n fine-tuned from COCO at 1280x1280, 100 epochs, seed 0.
# Recipe v1 (same as every Stack): Ultralytics defaults + optimizer forced to MuSGD lr0 0.01 momentum 0.9
# (effective batch 64 through nbs) + close_mosaic 0 (mosaic kept to the end).
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: yolo26n
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  extra:
    workers: 8
    cache: false
    batch: 16
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    close_mosaic: 0
eval:
  imgsz:
  - 1280
  splits:
  - valid
