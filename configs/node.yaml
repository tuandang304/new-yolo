# R7a confirmation: R4b at 1280, 100 epochs, seed 0, val only. See the experiment description.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r7a_100
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20.yaml
    head_c3: 32
    stride_mult: 64
    append_bottlenecks:
    - layer: 9
      n: 4
    append_psa:
    - layer: 11
      n: 2
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    detail_inject:
      src: 2
      dst: 17
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
  extra:
    workers: 8
    cache: false
eval:
  imgsz:
  - 1280
  splits:
  - valid
