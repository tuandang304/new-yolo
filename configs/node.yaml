# R2: PRA-a + SPD(L1,3,5) @928, 30 epochs
smoke: false
data_root: /tmp/visdrone/data
tasks: [data, train]
train:
  model: pra_spd
  epochs: 30
  imgsz: 928
  seeds: [0]
