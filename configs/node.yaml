# Access-0: R9b minus DIM and zero-init blocks; 30-epoch screen control with MuSGD forced (see experiment description).
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: access0
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
  extra:
    workers: 8
    cache: false
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
