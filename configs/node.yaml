# Access-1 ablation AB1 at 100 epochs (paper-grade): keep stride-64 pool, seed 0. Kaggle 2xT4 DDP (batch 16 total), eval valid + test.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: access1_ab1_100
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    access:
    - op: lowrank_conv
      layers: [8]
      rank: 64
    - op: lowrank_pw
      layers: [10]
      attr: cv2
      rank: 128
    - op: hybrid_c3k
      layers: [9]
      idx: 0
      replace: true
      ratio: 2
      d: 32
    - op: hybrid_c3k
      layers: [9]
      idx: 1
      replace: true
      ratio: 2
      d: 32
    - op: linattn_psa
      layers: [11]
    - op: repconv
      layers: [14]
  extra:
    workers: 4
    cache: false
    device: 0,1
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
  - test
