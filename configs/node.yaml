# Round 4 R4d: 30-epoch screening, val only. See the experiment description.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r4_r4d
  epochs: 30
  imgsz: 992
  seeds:
  - 0
  arch:
    yaml: models/pra_p3.yaml
    head_c3: 32
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    append_bottlenecks:
    - layer: 8
      n: 1
    inherit:
      offset: 0
      max_src: 16
      detect_levels:
      - 0
  extra:
    workers: 8
eval:
  imgsz:
  - 992
  splits:
  - valid
