# CPU re-measure (rounds) for the lean GuideDet-YOLO eval; previously:
# Lean GuideDet-YOLO ablation eval (Kaggle T4, no training). best.pt of the 9 lean ablations (nopath, noguide,
# fullrank x seeds 0-2; val was scored inside each training run). 1) test-dev with the headline evaluator
# (multi-label NMS, max_det 1000, ignore-aware, maxDets 500). 2) Table-2 latency protocol in one session for
# YOLO26n, lean GuideDet-YOLO (grp_s0 = group-ablation seed 0) and lean full-rank (fullrank_s0).
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
- name: latency
  split: valid
  ap: false
  rounds: 5
  order_seed: 0
  latency_images: 200
  n_warm: 30
  n_iter: 200
  deploy: {peak_mem: false, trt: false, onnx_cpu: false, cpu_rounds: 5, order_seed: 1, cpu_warm: 5, cpu_iter: 50, opset: 17}
  models:
  - {tag: yolo26n_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, latency: true}
  - {tag: grp_s0, family: ultralytics, ckpt: weights/grp_s0.pt, imgsz: 1280, latency: true}
  - {tag: fullrank_s0, family: ultralytics, ckpt: weights/fullrank_s0.pt, imgsz: 1280, latency: true}
