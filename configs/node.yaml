# Lean GuideDet-YOLO ablation eval (Kaggle T4, no training). best.pt of the 9 lean ablations (nopath, noguide,
# fullrank x seeds 0-2; val was scored inside each training run). 1) test-dev with the headline evaluator
# (multi-label NMS, max_det 1000, ignore-aware, maxDets 500). 2) Table-2 latency protocol in one session for
# YOLO26n, lean GuideDet-YOLO (grp_s0 = group-ablation seed 0) and lean full-rank (fullrank_s0).
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
- name: test
  split: test
  latency: false
  models:
  - {tag: nopath_s0, family: ultralytics, ckpt: weights/nopath_s0.pt, imgsz: 1280}
  - {tag: nopath_s1, family: ultralytics, ckpt: weights/nopath_s1.pt, imgsz: 1280}
  - {tag: nopath_s2, family: ultralytics, ckpt: weights/nopath_s2.pt, imgsz: 1280}
  - {tag: noguide_s0, family: ultralytics, ckpt: weights/noguide_s0.pt, imgsz: 1280}
  - {tag: noguide_s1, family: ultralytics, ckpt: weights/noguide_s1.pt, imgsz: 1280}
  - {tag: noguide_s2, family: ultralytics, ckpt: weights/noguide_s2.pt, imgsz: 1280}
  - {tag: fullrank_s0, family: ultralytics, ckpt: weights/fullrank_s0.pt, imgsz: 1280}
  - {tag: fullrank_s1, family: ultralytics, ckpt: weights/fullrank_s1.pt, imgsz: 1280}
  - {tag: fullrank_s2, family: ultralytics, ckpt: weights/fullrank_s2.pt, imgsz: 1280}
- name: latency
  split: valid
  ap: false
  rounds: 5
  order_seed: 0
  latency_images: 200
  n_warm: 30
  n_iter: 200
  deploy: {peak_mem: true, trt: true, onnx_cpu: true, n_warm: 30, n_iter: 200, cpu_warm: 5, cpu_iter: 50, opset: 17}
  models:
  - {tag: yolo26n_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, latency: true}
  - {tag: grp_s0, family: ultralytics, ckpt: weights/grp_s0.pt, imgsz: 1280, latency: true}
  - {tag: fullrank_s0, family: ultralytics, ckpt: weights/fullrank_s0.pt, imgsz: 1280, latency: true}
