# Access-2: see the experiment description. Base Access-0; 30-epoch screen, MuSGD forced.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: access2
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    access:
    - op: hybrid_c3k
      layers: [6, 14, 17]
      idx: 1
      ratio: 4
      d: 16
    - op: uib_c3k
      layers: [20]
      idx: 1
    - op: repconv
      layers: [18]
  extra:
    workers: 8
    cache: false
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
