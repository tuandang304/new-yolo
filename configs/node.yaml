# O-lite ablation AB5 (100 epochs): remove stride-64 context skip L11->cls in the detection head (head_ctx removed).
# 1.559 M params, 17.64 GFLOPs @1280. 100 epochs, seed 0, recipe v1, Kaggle T4 batch 8.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: olite_ab5_noctx
  epochs: 100
  imgsz: 1280
  seeds:
  - 1
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: true
    r12_neck:
      dysample: 15
    stack_o:
      s4: {at: 16, src: 2, guided: true, mid: 32, ch: 64}
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    close_mosaic: 0
eval:
  imgsz:
  - 1280
  splits:
  - valid
