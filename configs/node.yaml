# Round 3 P10: 30-epoch screening on L4 (val only). See the experiment description.
smoke: false
data_root: /tmp/visdrone/data
tasks: [data, train]
train:
  model: r3_p10
  epochs: 30
  imgsz: 960
  seeds: [0]
  arch:
    yaml: models/pra_p3.yaml
    head_c3: 32
    lowrank:
      layers: [3, 5]
      ratio: 0.75
    inherit:
      offset: 0
      max_src: 16
      detect_levels: [0]
  extra: {workers: 8}
eval:
  imgsz: [960]
  splits: [valid]
