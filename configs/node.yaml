# Ablation B1 of R9b for the IEEE Access revision; see the experiment description.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: abl_b1
  emit_ckpt: true
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    append_bottlenecks:
    - layer: 9
      n: 4
    append_psa:
    - layer: 11
      n: 2
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
  extra:
    workers: 8
    cache: false
eval:
  imgsz:
  - 1280
  splits:
  - valid
