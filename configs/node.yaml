# Edge baseline yolov10n @1280, same recipe as the TrimRes / YOLO26n control, seed 0.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: yolov10n
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  extra:
    workers: 8
    cache: false
    batch: 16
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
  - test
