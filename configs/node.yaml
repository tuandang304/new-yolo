smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: access1_ab6_100
  epochs: 100
  imgsz: 1280
  seeds:
  - 2
  arch:
    yaml: models/pra_a_o2m.yaml
    head_c3: 64
    stride_mult: 32
    inherit:
      ranges:
      - - 0
        - 19
        - 0
      detect_levels:
      - 0
      - 1
    access:
    - op: lowrank_conv
      layers:
      - 7
      rank: 64
    - op: lowrank_pw
      layers:
      - 9
      attr: cv2
      rank: 128
    - op: hybrid_c3k
      layers:
      - 8
      idx: 0
      replace: true
      ratio: 2
      d: 32
    - op: hybrid_c3k
      layers:
      - 8
      idx: 1
      replace: true
      ratio: 2
      d: 32
    - op: linattn_psa
      layers:
      - 10
    - op: repconv
      layers:
      - 13
  extra:
    workers: 8
    cache: false
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
