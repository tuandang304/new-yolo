# O-lite T4 latency (one session, 3 passes): YOLO26n, O-lite, O-Net(AB6) seed 0. Eval only, no training. VisDrone test-dev, headline evaluator (multi-label NMS, max_det 1000, ignore-aware), saves detections for TIDE/density analysis. Plus FP16 batch-1 latency in one T4 session, 3 alternating passes.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  split: test
  latency: true
  latency_images: 200
  latency_passes: 3
  n_warm: 30
  n_iter: 200
  models:
  - {tag: yolo26n_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, save_dets: true, latency: true}
  - {tag: olite_s0, family: ultralytics, ckpt: weights/olite_s0.pt, imgsz: 1280, save_dets: true, latency: true}
  - {tag: ab6_s0, family: ultralytics, ckpt: weights/ab6_s0.pt, imgsz: 1280, save_dets: true, latency: true}
