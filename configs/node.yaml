# Round 7 r7d: see the experiment description and round7-plan.md.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r7d
  epochs: 30
  imgsz: 1024
  seeds:
  - 0
  arch:
    yaml: models/pra_a20.yaml
    head_c3: 32
    stride_mult: 64
    append_bottlenecks:
    - layer: 9
      n: 4
    append_psa:
    - layer: 11
      n: 2
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    detail_inject:
      src: 2
      dst: 17
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    pair_loss:
      pairs:
      - - 3
        - 4
      - - 0
        - 1
      - - 2
        - 9
      - - 6
        - 7
      mode: relax
      value: 0.2
  extra:
    workers: 8
    cache: false
eval:
  imgsz:
  - 1024
  splits:
  - valid
