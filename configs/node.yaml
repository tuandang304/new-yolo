# G40 F-C (HR-GD-HHD framework, proposed by Antigravity, simplified): Stack B backbone + gather-and-distribute hub neck + taxonomic head on P2/P3/P4. 30 epochs, seed 0, batch 8, MuSGD lr0 0.01, one Kaggle T4.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: g40fc
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/g40_fc_gd.yaml
    head_c3:
    - 64
    - 96
    - 96
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 10
        - 1
      detect_levels:
      - -1
      - 0
      - 1
    win_attn:
      layer: 6
      dim: 32
      heads: 2
      win: 8
    framework:
      type: gd
      at: 12
      src:
      - 2
      - 4
      - 6
      - 11
      cs:
      - 32
      - 64
      - 128
      hub: 96
      nhub: 2
    head_cls_depth: 2
    head_b2c: true
    hier:
      mode: sum
      weight: 0.35
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
