# YOLO26n NMS-free eval (Kaggle T4, no training). The same-recipe YOLO26n checkpoints (seeds 0-2; runs f15f05d1,
# 99bfae90, 6e8503f2) carry a trained one-to-one branch. 1) Score it NMS-free (nms=False) on val and test-dev with the
# headline evaluator (max_det 1000, ignore-aware, maxDets 500). 2) One-session T4 latency (5 shuffled rounds, PyTorch FP16
# end-to-end + forward, TensorRT FP16 end-to-end) of YOLO26n with NMS and NMS-free, GuideDet-YOLO and GuideDet-YOLO-F (seed 0, NMS).
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
- name: valid_e2e
  split: valid
  latency: false
  models:
  - {tag: yolo26n_e2e_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, nms: false}
  - {tag: yolo26n_e2e_s1, family: ultralytics, ckpt: weights/yolo26n_s1.pt, imgsz: 1280, nms: false}
  - {tag: yolo26n_e2e_s2, family: ultralytics, ckpt: weights/yolo26n_s2.pt, imgsz: 1280, nms: false}
- name: test_e2e
  split: test
  latency: false
  models:
  - {tag: yolo26n_e2e_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, nms: false}
  - {tag: yolo26n_e2e_s1, family: ultralytics, ckpt: weights/yolo26n_s1.pt, imgsz: 1280, nms: false}
  - {tag: yolo26n_e2e_s2, family: ultralytics, ckpt: weights/yolo26n_s2.pt, imgsz: 1280, nms: false}
- name: latency
  split: valid
  ap: false
  rounds: 5
  order_seed: 0
  latency_images: 200
  n_warm: 30
  n_iter: 200
  deploy: {peak_mem: false, trt: true, onnx_cpu: false, n_warm: 30, n_iter: 200}
  models:
  - {tag: yolo26n_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, latency: true}
  - {tag: yolo26n_e2e_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, latency: true, nms: false}
  - {tag: grp_s0, family: ultralytics, ckpt: weights/grp_s0.pt, imgsz: 1280, latency: true}
  - {tag: fullrank_s0, family: ultralytics, ckpt: weights/fullrank_s0.pt, imgsz: 1280, latency: true}
