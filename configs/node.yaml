# Lean GuideDet-YOLO ablation (fullrank, 100 epochs, seed 1): plain 3x3 stride-2 convs instead of LR-Down at L3/L5/L8.
# Lean base = GuideDet-YOLO without DySample, P4->P3 feedback and context skip. Recipe v1, Kaggle T4 batch 8.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: lean_fullrank_s1
  epochs: 100
  imgsz: 1280
  seeds:
  - 1
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: false
    stack_o:
      s4: {at: 16, src: 2, guided: true, mid: 32, ch: 64}
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    close_mosaic: 0
eval:
  imgsz:
  - 1280
  splits:
  - valid
