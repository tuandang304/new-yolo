# R11 latency: LiteSpan-YOLO and the round-11 stacks measured in one T4 session. No training; val only.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  latency_images: 200
  latency_passes: 2
  n_warm: 30
  n_iter: 200
  models:
  - {tag: hrn_s0, family: ultralytics, ckpt: weights/hrn_s0.pt, imgsz: 1280, latency: true, save_dets: false}
  - {tag: r11c0_s0, family: ultralytics, ckpt: weights/r11c0_s0.pt, imgsz: 1280, latency: true, save_dets: false}
  - {tag: r11sa_s0, family: ultralytics, ckpt: weights/r11sa_s0.pt, imgsz: 1280, latency: true, save_dets: false}
  - {tag: r11sb_s0, family: ultralytics, ckpt: weights/r11sb_s0.pt, imgsz: 1280, latency: true, save_dets: false}
  - {tag: r11sd_s0, family: ultralytics, ckpt: weights/r11sd_s0.pt, imgsz: 1280, latency: true, save_dets: false}
  - {tag: r11se_s0, family: ultralytics, ckpt: weights/r11se_s0.pt, imgsz: 1280, latency: true, save_dets: false}
