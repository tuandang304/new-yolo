# R1 control: RDD-t2 @1280 (no detail stream), 30 epochs
smoke: false
data_root: /tmp/visdrone/data
tasks: [data, train]
train:
  model: rdd_t2
  epochs: 30
  imgsz: 1280
  seeds: [0]
  extra: {cache: false}
  arch: {yaml: models/rdd_t2.yaml, stride_mult: 64, inherit: {offset: 2, max_src: 19, detect_levels: [0, 0, 1]}}
eval: {imgsz: [1280], splits: [valid]}   # screening: val only (test-dev stays closed)
