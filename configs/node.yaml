# Round 6 R6a: R4b at 640 px input, x1.5 bilinear lift at L1 (trunk on the R4b@960 grid), 30 ep, seed 0.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r6a
  epochs: 30
  imgsz: 640
  seeds:
  - 0
  arch:
    yaml: models/pra_a20.yaml
    head_c3: 32
    stride_mult: 128
    append_bottlenecks:
    - layer: 9
      n: 4
    append_psa:
    - layer: 11
      n: 2
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    detail_inject:
      src: 2
      dst: 17
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    lift:
      layer: 1
      scale: 1.5
  extra:
    workers: 8
eval:
  imgsz:
  - 640
  splits:
  - valid
