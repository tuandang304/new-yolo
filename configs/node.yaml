# Round 6 R6b: R4b at 640 px + top-down P2 branch, Detect P2/P3/P4 (P2 box head from COCO P3), zero-init P2->P3 bottom-up, 30 ep, seed 0.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r6b
  epochs: 30
  imgsz: 640
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_p2.yaml
    head_c3: 32
    stride_mult: 64
    append_bottlenecks:
    - layer: 9
      n: 4
    append_psa:
    - layer: 11
      n: 2
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    detail_inject:
      src: 2
      dst: 17
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 0
      - 1
    detect_bu: true
  extra:
    workers: 8
eval:
  imgsz:
  - 640
  splits:
  - valid
