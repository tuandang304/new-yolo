# Root node: data audit + parity re-evaluation of public DetectionBench VisDrone checkpoints (Kaggle T4; the Kaggle TPU queue stalled >2 h, so the TPU/XLA probe moves to a later node).
smoke: false
data_root: /tmp/visdrone/data
tasks: [data, tpu_probe, parity]  # tpu_probe only reports when torch_xla is present
splits: [valid, test]
probe_rfdetr_xla: true
probe_timeout_s: 1800
parity:
  - {name: db_yolo26n,     family: ultralytics, repo: dronefreak/visdrone-yolo26n,     file: best.pt,                   imgsz: [1280, 640]}
  - {name: db_yolo11n,     family: ultralytics, repo: dronefreak/visdrone-yolo11n,     file: best.pt,                   imgsz: [1280, 640]}
  - {name: db_yolov10n,    family: ultralytics, repo: dronefreak/visdrone-yolov10n,    file: best.pt,                   imgsz: [1280, 640]}
  - {name: db_rfdetr_nano, family: rfdetr,      repo: dronefreak/visdrone-rfdetr-nano, file: checkpoint_best_total.pth, imgsz: [640, 1280]}
