# G40 F-A (HR-Exchange framework): Stack B backbone + new parallel-stream neck and 3-level head. 30 epochs, seed 0, batch 8, MuSGD lr0 0.01, one Kaggle T4.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: g40fa
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/g40_fa_hr.yaml
    head_c3:
    - 32
    - 96
    - 128
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 10
        - 1
    win_attn:
      layer: 6
      dim: 32
      heads: 2
      win: 8
    framework:
      type: hr
      at: 12
      src:
      - 2
      - 4
      - 6
      - 11
      cs:
      - 32
      - 96
      - 160
      units: 3
      k: 7
      e: 2
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
