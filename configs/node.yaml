# G40 F-B (HexNet framework, proposed by OpenCode): Stack B backbone + two-stream exchange neck + hierarchical head. 30 epochs, seed 0, batch 8, MuSGD lr0 0.01, one Kaggle T4.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: g40fb
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/g40_fb_hex.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 10
        - 1
      detect_levels:
      - 0
      - 1
    win_attn:
      layer: 6
      dim: 32
      heads: 2
      win: 8
    framework:
      type: hex
      at: 12
      src:
      - 2
      - 4
      - 6
      - 11
      cs:
      - 64
      - 128
      cap: 5
      k: 7
    head_cls_depth: 3
    head_b2c: true
    hier:
      mode: product
      weight: 0.35
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
