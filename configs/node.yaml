# SMOKE: TrimRes-YOLO s0 + YOLO26n, 1 round, few iterations, to check TensorRT export of the custom blocks on the Jetson.
# Full node: same protocol as the T4 node 996c54f9 (5 shuffled rounds, first 200 sorted val images, 30 warm-up, e2e at conf 0.25
# + forward-only) plus one TensorRT FP16 engine per model, built on the device in a fresh process, and peak memory.
smoke: false
data_root: ~/visdrone/data
data_splits: [valid]
tasks:
- measure
measure:
  split: valid
  ap: false
  rounds: 1
  order_seed: 0
  latency_images: 20
  n_warm: 5
  n_iter: 20
  deploy: {prebuild_engines: true, peak_mem: true, trt: true, onnx_cpu: false, n_warm: 5, n_iter: 20}
  models:
  - {tag: access1_s0, family: ultralytics, ckpt: weights/access1_s0.pt, imgsz: 1280, latency: true}
  - {tag: yolo26n_l4_s0, family: ultralytics, ckpt: weights/yolo26n_sr_s0.pt, imgsz: 1280, latency: true}
