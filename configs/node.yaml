# Round 3 A30: 30-epoch screening on L4 (val only). See the experiment description.
smoke: false
data_root: /tmp/visdrone/data
tasks: [data, train]
train:
  model: r3_a30
  epochs: 30
  imgsz: 1024
  seeds: [0]
  arch:
    yaml: models/pra_a30.yaml
    head_c3: 16
    stride_mult: 64
    append_bottlenecks:
    - {layer: 9, n: 1}
    append_psa:
    - {layer: 11, n: 1}
    inherit:
      ranges:
      - [0, 6, 0]
      - [7, 16, 1]
      detect_levels: [0, 1]
  extra: {workers: 8}
eval:
  imgsz: [1024]
  splits: [valid]
