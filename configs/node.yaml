# GuideDet-YOLO group ablation (100 epochs, seed 1): remove DySample (L15 nearest), P4->P3 head feedback and the
# stride-64 context skip together; keeps the guided stride-4 path (O-1 + O-2) and LR-Down (L3/L5/L8).
# 100 epochs, recipe v1, Kaggle T4 batch 8.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: guidedet_grp_s1
  epochs: 100
  imgsz: 1280
  seeds:
  - 1
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: false
    stack_o:
      s4: {at: 16, src: 2, guided: true, mid: 32, ch: 64}
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    close_mosaic: 0
eval:
  imgsz:
  - 1280
  splits:
  - valid
