data_root: /tmp/visdrone/data
tasks: [data, train]
train:
  model: pra_a
  epochs: 30
  imgsz: 864
  seeds: [1]
  arch: {yaml: models/pra_a.yaml, head_c3: 32, inherit: {offset: 0, max_src: 19, detect_levels: [0, 1]}}
eval: {imgsz: [864], splits: [valid]}   # screening: val only (test-dev stays closed)
