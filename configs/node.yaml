# Lean GuideDet-YOLO ablation (noguide, 100 epochs, seed 2): unguided stride-4 path (raw L2 feature).
# Lean base = GuideDet-YOLO without DySample, P4->P3 feedback and context skip. Recipe v1, Kaggle T4 batch 8.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: lean_noguide_s2
  epochs: 100
  imgsz: 1280
  seeds:
  - 2
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: false
    stack_o:
      s4: {at: 16, src: 2, guided: false, mid: 32, ch: 64}
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    close_mosaic: 0
eval:
  imgsz:
  - 1280
  splits:
  - valid
