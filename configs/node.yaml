# G40 L1: Stack B + NWD in box loss and TAL overlap. 30 epochs, seed 0, batch 8, one Kaggle T4.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: g40l1
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: true
    head_ctx:
      src: 11
      dim: 32
    win_attn:
      layer: 6
      dim: 32
      heads: 2
      win: 8
    head_b2c: true
    loss_cfg:
      nwd:
        alpha: 0.5
        c: 12.8
        assign: true
  extra:
    workers: 8
    cache: false
    batch: 8
eval:
  imgsz:
  - 1280
  splits:
  - valid
