# O-lite ablation AB4 (100 epochs): remove P4->P3 feedback in the detection head (head_fb: false).
# 1.566 M params, 17.70 GFLOPs @1280. 100 epochs, seed 0, recipe v1, Kaggle T4 batch 8.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: olite_ab4_nofb
  epochs: 100
  imgsz: 1280
  seeds:
  - 2
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 2
        - 6
        - 2
      - - 7
        - 19
        - 1
      detect_levels:
      - 2
      - 1
    head_fb: false
    head_ctx:
      src: 11
      dim: 32
    r12_neck:
      dysample: 15
    stack_o:
      s4: {at: 16, src: 2, guided: true, mid: 32, ch: 64}
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    close_mosaic: 0
eval:
  imgsz:
  - 1280
  splits:
  - valid
