# Jetson TensorRT AP for seeds 1 and 2 (inference only, 1280x1280, batch 1): completes Supp. Table S3 to three seeds.
# FP16 and INT8 engines (INT8 calibrated on the same 512 random train images, seed 0) built on the Orin Nano in MAXN_SUPER
# with jetson_clocks, scored on val with the headline evaluator. modes: [] skips all timing. Protocol: bench/jetson.py.
smoke: false
data_root: ~/visdrone/data
data_splits: [train, valid]
tasks:
- jetson
jetson:
  modes: []
  final_mode: MAXN_SUPER
  batches: [1]
  precisions: [fp16, int8]
  calib_images: 512
  ap: true
  models:
  - {tag: yolo26n_s1, ckpt: weights/yolo26n_s1.pt, imgsz: 1280}
  - {tag: grp_s1, ckpt: weights/grp_s1.pt, imgsz: 1280}
  - {tag: fullrank_s1, ckpt: weights/fullrank_s1.pt, imgsz: 1280}
  - {tag: yolo26n_s2, ckpt: weights/yolo26n_s2.pt, imgsz: 1280}
  - {tag: grp_s2, ckpt: weights/grp_s2.pt, imgsz: 1280}
  - {tag: fullrank_s2, ckpt: weights/fullrank_s2.pt, imgsz: 1280}
