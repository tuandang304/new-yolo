# Round 4 R4e: 30-epoch screening, val only. See the experiment description.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r4_r4e
  epochs: 30
  imgsz: 960
  seeds:
  - 0
  arch:
    yaml: models/pra_a45.yaml
    head_c3:
    - 16
    - 32
    - 32
    stride_mult: 64
    append_bottlenecks:
    - layer: 9
      n: 3
    append_psa:
    - layer: 11
      n: 1
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - -1
      - 0
      - 1
      partial: true
  extra:
    workers: 8
eval:
  imgsz:
  - 960
  splits:
  - valid
