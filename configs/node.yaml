# Sci Rep ablation 1: Stack J without DySample, Gate and PConv-MF (Ctx skip + FB kept). 100 ep, seed 0,
# J recipe (batch 16 total), DDP over Kaggle's 2 T4s (8 per GPU).
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: abl1_noheadadd
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: true
    head_ctx:
      src: 11
      dim: 32
  extra:
    workers: 4
    cache: false
    device: 0,1
eval:
  imgsz:
  - 1280
  splits:
  - valid
