# Access paper K-test (Kaggle T4, no training): test-dev of same-recipe YOLO26n s0, public checkpoints, AB1 s1, AB8 s2.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  split: test
  latency_images: 200
  latency_passes: 2
  n_warm: 30
  n_iter: 200
  models:
  - {tag: yolo26n_sr_s0, family: ultralytics, ckpt: weights/yolo26n_sr_s0.pt, imgsz: 1280, save_dets: true}
  - {tag: ab1_s1, family: ultralytics, ckpt: weights/ab1_s1.pt, imgsz: 1280}
  - {tag: ab8_s2, family: ultralytics, ckpt: weights/ab8_s2.pt, imgsz: 1280}
  - {tag: pub_yolo26n, family: ultralytics, ckpt: weights/pub_yolo26n.pt, imgsz: 1280}
  - {tag: pub_yolo11n, family: ultralytics, ckpt: weights/pub_yolo11n.pt, imgsz: 1280}
  - {tag: pub_yolov10n, family: ultralytics, ckpt: weights/pub_yolov10n.pt, imgsz: 1280}
  - {tag: rfdetr_nano, family: rfdetr, imgsz: 640, pos_enc: 40}
