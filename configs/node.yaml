# Fine-tune rfdetr-nano from its official COCO checkpoint; evaluate with the unified evaluator.
# 100 epochs at ~8-10 min/epoch (CPU-side Hungarian matching dominates) exceed Kaggle/Colab session caps,
# so this node trains on a Google Cloud L4 VM (no session cap);
# its T4 latency comes from the smoke run on Kaggle T4 (latency depends on architecture only).
smoke: false
data_root: /tmp/visdrone/data
tasks: [data, train]
train: {model: rfdetr-nano, epochs: 100, imgsz: 640, seeds: [0], extra: {checkpoint_interval: 50, num_workers: 4}}
eval: {imgsz: [640, 1280], splits: [valid, test]}
