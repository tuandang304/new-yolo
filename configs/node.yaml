# O-lite test-dev eval J2: olite_s2, ab6_s0, ab6_s1, ab6_s2, olite_trim_s0. Eval only, no training. VisDrone test-dev, headline evaluator (multi-label NMS, max_det 1000, ignore-aware), saves detections for TIDE/density analysis.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  split: test
  latency: false
  latency_images: 200
  latency_passes: 2
  n_warm: 30
  n_iter: 200
  models:
  - {tag: olite_s2, family: ultralytics, ckpt: weights/olite_s2.pt, imgsz: 1280, save_dets: true}
  - {tag: ab6_s0, family: ultralytics, ckpt: weights/ab6_s0.pt, imgsz: 1280, save_dets: true}
  - {tag: ab6_s1, family: ultralytics, ckpt: weights/ab6_s1.pt, imgsz: 1280, save_dets: true}
  - {tag: ab6_s2, family: ultralytics, ckpt: weights/ab6_s2.pt, imgsz: 1280, save_dets: true}
  - {tag: olite_trim_s0, family: ultralytics, ckpt: weights/olite_trim_s0.pt, imgsz: 1280, save_dets: true}
