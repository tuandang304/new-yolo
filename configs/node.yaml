# GuideDet-YOLO (lean) with YOLO26n's default end-to-end head: one-to-many + one-to-one branches trained (end2end: true).
# Only change vs the group-ablation node: models/pra_a20_o2m.yaml -> models/pra_a20.yaml. Scored on val + test-dev with the
# headline evaluator twice: one-to-many + multi-label NMS, and NMS-free one-to-one (eval.nms_free). 100 epochs, recipe v1, Kaggle T4 b8.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: guidedet_e2e_s0
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: false
    stack_o:
      s4: {at: 16, src: 2, guided: true, mid: 32, ch: 64}
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    close_mosaic: 0
eval:
  imgsz:
  - 1280
  splits:
  - valid
  - test
  nms_free: true
