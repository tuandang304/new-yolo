# Access-1 ablation AB3: original C3k2 at L8. Same 30-epoch screen recipe as Access-1.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: access1_ab3
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a_o2m.yaml
    head_c3: 64
    stride_mult: 32
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 19
        - 0
      detect_levels:
      - 0
      - 1
    access:
    - op: lowrank_conv
      layers: [7]
      rank: 64
    - op: lowrank_pw
      layers: [9]
      attr: cv2
      rank: 128
    - op: linattn_psa
      layers: [10]
    - op: repconv
      layers: [13]
  extra:
    workers: 8
    cache: false
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
