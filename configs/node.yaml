# Round 3 P15: 30-epoch screening on L4 (val only). See the experiment description.
smoke: false
data_root: /tmp/visdrone/data
tasks: [data, train]
train:
  model: r3_p15
  epochs: 30
  imgsz: 960
  seeds: [0]
  arch:
    yaml: models/pra_a10.yaml
    head_c3: 24
    replace_c2psa: 10
    lowrank:
      layers: [3, 5]
      ratio: 0.75
    inherit:
      offset: 0
      max_src: 16
      detect_levels: [0, 1]
  extra: {workers: 8}
eval:
  imgsz: [960]
  splits: [valid]
