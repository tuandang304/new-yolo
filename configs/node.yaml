# R12 latency: R11 Stacks A, B and R12 Stacks G and J measured in one T4 session. No training; val only.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  latency_images: 200
  latency_passes: 2
  n_warm: 30
  n_iter: 200
  models:
  - {tag: r11sa_s0, family: ultralytics, ckpt: weights/r11sa_s0.pt, imgsz: 1280, latency: true, save_dets: false}
  - {tag: r11sb_s0, family: ultralytics, ckpt: weights/r11sb_s0.pt, imgsz: 1280, latency: true, save_dets: false}
  - {tag: r12sg_s0, family: ultralytics, ckpt: weights/r12sg_s0.pt, imgsz: 1280, latency: true, save_dets: false}
  - {tag: r12sj_s0, family: ultralytics, ckpt: weights/r12sj_s0.pt, imgsz: 1280, latency: true, save_dets: false}
