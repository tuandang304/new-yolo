# O-lite test-dev eval J1: yolo26n_s0, yolo26n_s1, yolo26n_s2, olite_s0, olite_s1. Eval only, no training. VisDrone test-dev, headline evaluator (multi-label NMS, max_det 1000, ignore-aware), saves detections for TIDE/density analysis.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  split: test
  latency: false
  latency_images: 200
  latency_passes: 2
  n_warm: 30
  n_iter: 200
  models:
  - {tag: yolo26n_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, save_dets: true}
  - {tag: yolo26n_s1, family: ultralytics, ckpt: weights/yolo26n_s1.pt, imgsz: 1280, save_dets: true}
  - {tag: yolo26n_s2, family: ultralytics, ckpt: weights/yolo26n_s2.pt, imgsz: 1280, save_dets: true}
  - {tag: olite_s0, family: ultralytics, ckpt: weights/olite_s0.pt, imgsz: 1280, save_dets: true}
  - {tag: olite_s1, family: ultralytics, ckpt: weights/olite_s1.pt, imgsz: 1280, save_dets: true}
