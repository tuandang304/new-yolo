# Revision A1+A3 (IEEE Access, approved 2026-11-05): one-time test-dev evaluation of the frozen paper checkpoints
# and RF-DETR-Nano at its published configuration; RF-DETR params/FLOPs recount. No training, no selection.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  split: test
  latency: false
  rfdetr_complexity: true
  models:
  - {tag: hrn_s0, family: ultralytics, ckpt: weights/hrn_s0.pt, imgsz: 1280, save_dets: true}
  - {tag: hrn_s1, family: ultralytics, ckpt: weights/hrn_s1.pt, imgsz: 1280, save_dets: true}
  - {tag: hrn_s2, family: ultralytics, ckpt: weights/hrn_s2.pt, imgsz: 1280, save_dets: true}
  - {tag: yolo26n_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 640, save_dets: true}
  - {tag: yolo26n_s1, family: ultralytics, ckpt: weights/yolo26n_s1.pt, imgsz: 640, save_dets: true}
  - {tag: yolo26n_s2, family: ultralytics, ckpt: weights/yolo26n_s2.pt, imgsz: 640, save_dets: true}
  - {tag: yolo11n_s0, family: ultralytics, ckpt: weights/yolo11n_s0.pt, imgsz: 640}
  - {tag: yolo11n_s1, family: ultralytics, ckpt: weights/yolo11n_s1.pt, imgsz: 640}
  - {tag: yolo11n_s2, family: ultralytics, ckpt: weights/yolo11n_s2.pt, imgsz: 640}
  - {tag: yolov10n_s0, family: ultralytics, ckpt: weights/yolov10n_s0.pt, imgsz: 640}
  - {tag: yolov10n_s1, family: ultralytics, ckpt: weights/yolov10n_s1.pt, imgsz: 640}
  - {tag: yolov10n_s2, family: ultralytics, ckpt: weights/yolov10n_s2.pt, imgsz: 640}
  - {tag: rfdetr_nano, family: rfdetr, imgsz: 640, pos_enc: 40, save_dets: true}
