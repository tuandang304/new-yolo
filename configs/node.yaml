# Stack N screen eval: no training, no selection beyond the pre-set pass rule.
# The four scene-vector runs (N, -aux, -FiLM, -b(s)) finished all 30 epochs but crashed in Ultralytics' final fp16 val
# (sc_mlp received a float input with half weights; fixed in bench/pra.py). This job scores the five downloaded 30-ep
# best.pt files on val with the project evaluator (ign-aware, multi-label NMS, max_det 1000) and saves the detections
# for the confusion analysis. The control finished normally; it is re-scored here so all five come from one session.
# FP16 batch-1 latency of N and the control on the same T4, two passes in opposite order.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  split: valid
  latency: true
  models:
  - {tag: n_s0, family: ultralytics, ckpt: weights/r13n_s0.pt, imgsz: 1280, save_dets: true, latency: true}
  - {tag: ctrl_s0, family: ultralytics, ckpt: weights/r13n_ctrl_s0.pt, imgsz: 1280, save_dets: true, latency: true}
  - {tag: noaux_s0, family: ultralytics, ckpt: weights/r13n_noaux_s0.pt, imgsz: 1280, save_dets: true}
  - {tag: nofilm_s0, family: ultralytics, ckpt: weights/r13n_nofilm_s0.pt, imgsz: 1280, save_dets: true}
  - {tag: nobias_s0, family: ultralytics, ckpt: weights/r13n_nobias_s0.pt, imgsz: 1280, save_dets: true}
