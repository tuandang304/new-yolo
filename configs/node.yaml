# Round 6 R6d: R4b at width 0.375 (4.92M params), overlapping-slice COCO copy incl. SVD factors, 640 px, 30 ep, seed 0.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r6d
  epochs: 30
  imgsz: 640
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_w375.yaml
    head_c3: 48
    stride_mult: 64
    append_bottlenecks:
    - layer: 9
      n: 4
    append_psa:
    - layer: 11
      n: 2
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    detail_inject:
      src: 2
      dst: 17
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
      partial: true
  extra:
    workers: 8
eval:
  imgsz:
  - 640
  splits:
  - valid
