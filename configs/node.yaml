# O-lite-trim (100 epochs, seed 0): remove both single-seed neutral components (AB3 DySample at L15 and AB5 stride-64 context skip L11->cls),
# keeping O-1 stride-4 stem + O-2 top-down guided stride-4 feature, P4->P3 head feedback (S2), and LR-Down (L3/L5/L8).
# 1.558 M params, 17.63 GFLOPs @1280. 100 epochs, seed 0, recipe v1, Kaggle T4 batch 8.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: olite_trim_s0
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: true
    stack_o:
      s4: {at: 16, src: 2, guided: true, mid: 32, ch: 64}
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    close_mosaic: 0
eval:
  imgsz:
  - 1280
  splits:
  - valid
