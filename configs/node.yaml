# Access paper control: plain YOLO26n fine-tuned from COCO at 1280, 100 epochs, seed 1. Kaggle 2xT4 DDP (batch 16 total), eval valid + test.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: yolo26n
  epochs: 100
  imgsz: 1280
  seeds:
  - 1
  extra:
    workers: 4
    cache: false
    batch: 16
    device: 0,1
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
  - test
