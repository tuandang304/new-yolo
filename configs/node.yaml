# B2: YOLO26n uniformly width-scaled to TrimRes params (w 0.18), COCO init by channel slicing; same recipe as the L4 control.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: yolo26n_w018
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/yolo26n_w0.18.yaml
    init: yolo26n.pt
    inherit:
      detect_levels: [0, 1, 2]
      partial: true
  extra:
    workers: 8
    cache: false
    batch: 16
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    warmup_bias_lr: 0.0
eval:
  imgsz:
  - 1280
  splits:
  - valid
  - test
