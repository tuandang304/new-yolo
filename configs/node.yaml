# R11 S3 DIM-8-DW. Round 11 screen: 30 epochs, seed 0, batch 8 on one Kaggle T4.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r11s3
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    append_bottlenecks:
    - layer: 9
      n: 4
    append_psa:
    - layer: 11
      n: 2
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    detail_inject:
      src: 2
      dst: 17
      ch: 8
      dw: true
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
  extra:
    workers: 8
    cache: false
    batch: 8
eval:
  imgsz:
  - 1280
  splits:
  - valid
