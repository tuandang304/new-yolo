# GuideDet-YOLO paper latency (Kaggle T4, no training, no AP). Seed-0 weights of YOLO26n, GuideDet-YOLO (olite) and GuideDet-YOLO-F (ab6).
# 1) PyTorch FP16: 5 interleaved rounds, shuffled order, end-to-end + forward-only (same protocol as the 2026-11-10 re-measure).
# 2) Deployment: peak GPU memory (PyTorch FP16), TensorRT FP16 engine end-to-end, ONNX Runtime FP32 CPU end-to-end.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- measure
measure:
  split: valid
  ap: false
  rounds: 5
  order_seed: 0
  latency_images: 200
  n_warm: 30
  n_iter: 200
  deploy: {peak_mem: true, trt: true, onnx_cpu: true, n_warm: 30, n_iter: 200, cpu_warm: 5, cpu_iter: 50, opset: 17}
  models:
  - {tag: yolo26n_s0, family: ultralytics, ckpt: weights/yolo26n_s0.pt, imgsz: 1280, latency: true}
  - {tag: guidedet_s0, family: ultralytics, ckpt: weights/olite_s0.pt, imgsz: 1280, latency: true}
  - {tag: guidedet_f_s0, family: ultralytics, ckpt: weights/ab6_s0.pt, imgsz: 1280, latency: true}
