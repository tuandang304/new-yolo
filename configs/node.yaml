# Code-release check on the Jetson: the public GuideDet-YOLO repo (release/GuideDet-YOLO = commit 529c28e of
# github.com/tuandang304/GuideDet-YOLO before push) run end to end with its own scripts. Inference + 1-epoch smoke
# training only. Checks: val.py on guidedet_yolo_s0 reproduces the paper's seed-0 AP (val 30.70, test-dev 23.88,
# +-0.10); benchmark_jetson.py FP16 engine AP matches Supp. Table S3 (30.74, +-0.15). Steps: bench/release.py.
smoke: false
data_root: ~/visdrone/data
data_splits: [valid]
tasks:
- release
release:
  repo: release/GuideDet-YOLO
  data_root: ~/release-check/visdrone
  zip_cache: ~/visdrone/visdrone_zips
  expect_ap: {valid: 30.70, test: 23.88}
  tol: 0.10
  expect_trt_fp16: 30.74
  tol_trt: 0.15
  train_set: [epochs=1, imgsz=640, batch=2, workers=2, fraction=0.02, plots=False]
