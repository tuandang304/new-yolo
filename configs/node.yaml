# Round 5 R5c: 30-epoch screening, val only. See the experiment description.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r5_r5c
  epochs: 30
  imgsz: 1024
  seeds:
  - 0
  arch:
    yaml: models/pra_a20.yaml
    head_c3:
    - 32
    - 48
    stride_mult: 64
    append_bottlenecks:
    - layer: 9
      n: 4
    append_psa:
    - layer: 11
      n: 2
    lowrank:
      layers:
      - 3
      - 5
      ratio: 0.5
    detail_inject:
      src: 2
      dst: 17
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_k:
    - 3
    - 7
  extra:
    workers: 8
eval:
  imgsz:
  - 1024
  splits:
  - valid
