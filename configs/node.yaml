# R12 Stack G. Round 12 screen: 30 epochs, seed 0, batch 8 on one Kaggle T4.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r12sg
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: true
    head_ctx:
      src: 11
      dim: 32
    r12_neck:
      carafe:
      - 12
      - 15
      hpconcat:
      - 13
      - 16
    r12_head:
      br: true
  extra:
    workers: 8
    cache: false
    batch: 8
eval:
  imgsz:
  - 1280
  splits:
  - valid
