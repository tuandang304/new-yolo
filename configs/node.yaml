# R12 J 100 ep. 100-epoch confirm, seed 0, R9b recipe (batch 16).
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: r12j100
  epochs: 100
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: true
    head_ctx:
      src: 11
      dim: 32
    r12_neck:
      dysample: 15
    r12_head:
      l11gate: true
      pconv_mf: true
  extra:
    workers: 8
    cache: false
eval:
  imgsz:
  - 1280
  splits:
  - valid
