# Stack N under recipe v1: 30 epochs, seed 0, Colab T4 (batch 8; nbs 64 keeps the effective batch at 64).
# Same architecture as Stack N (scene vector -> FiLM + b(s) + aux count loss 0.05); only the recipe changes:
# optimizer forced to MuSGD lr0 0.01 momentum 0.9 (was auto -> AdamW 0.000714) and close_mosaic 0.
# Paired with the recipe-v1 control screen (node 7dd5a3be). Includes the fp16 scene-MLP cast fix.
smoke: false
data_root: /tmp/visdrone/data
tasks:
- data
- train
train:
  model: v1scr_n
  epochs: 30
  imgsz: 1280
  seeds:
  - 0
  arch:
    yaml: models/pra_a20_o2m.yaml
    head_c3: 64
    stride_mult: 64
    lowrank:
      layers:
      - 3
      - 5
      - 8
      ratio: 0.5
    inherit:
      ranges:
      - - 0
        - 6
        - 0
      - - 7
        - 19
        - 1
      detect_levels:
      - 0
      - 1
    head_fb: true
    head_ctx:
      src: 11
      dim: 32
    r12_neck:
      dysample: 15
    r12_head:
      scene:
        dim: 64
        film: true
        bias: true
        aux: true
    scene_loss: 0.05
  extra:
    workers: 8
    cache: false
    batch: 8
    optimizer: MuSGD
    lr0: 0.01
    momentum: 0.9
    close_mosaic: 0
eval:
  imgsz:
  - 1280
  splits:
  - valid
